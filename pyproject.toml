[project]
name = "shipveto"
version = "0.1.0"
description = "A Switch agent that tests support-agent prompt versions in team chat before release"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "openai>=3.46.0",
    "pyyaml>=6.0.3",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
